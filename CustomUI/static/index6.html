<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Dynamic Sales Order Bot</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f5f5; --bg-chat: #ffffff; --text: #1a1a1a; --text-muted: #6b7280;
            --accent: #2563eb; --user-bubble: #2563eb; --user-text: #ffffff;
            --bot-bubble: #e5e7eb; --bot-text: #1a1a1a; --border: #e5e7eb;
            --radius: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); height: 100vh; display: flex; justify-content: center; align-items: center; }
        .chat-wrapper { width: 100%; max-width: 1200px; height: 95vh; background: var(--bg-chat); border-radius: var(--radius); display: flex; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
        .chat-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        .chat-header { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
        .chat-header .icon { width: 40px; height: 40px; background: var(--accent); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: white; }
        .chat-header h1 { font-size: 1.1rem; }
        .settings-toggle-btn { margin-left: auto; cursor: pointer; border: 1px solid var(--border); background: transparent; padding: 8px; border-radius: 8px; }
        
        .chat-messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
        .message { display: flex; gap: 10px; max-width: 85%; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message.bot { align-self: flex-start; }
        .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
        .message.user .avatar { background: var(--user-bubble); color: white; }
        .message.bot .avatar { background: var(--bot-bubble); }
        .bubble { padding: 12px 16px; border-radius: var(--radius); font-size: 0.92rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
        .message.user .bubble { background: var(--user-bubble); color: var(--user-text); border-bottom-right-radius: 4px; }
        .message.bot .bubble { background: var(--bot-bubble); color: var(--bot-text); border-bottom-left-radius: 4px; }
        .bubble.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
        
        .input-bar { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; }
        .input-bar input { flex: 1; padding: 12px 16px; border: 1px solid var(--border); border-radius: 12px; font-size: 0.92rem; outline: none; }
        .input-bar button { padding: 12px 20px; background: var(--accent); color: white; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; }

        .settings-sidebar { width: 320px; background: #f9fafb; border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; transition: width 0.3s; }
        .settings-sidebar.collapsed { width: 0; border: none; }
        .settings-header { padding: 16px; border-bottom: 1px solid var(--border); font-weight: bold; }
        .settings-section { padding: 16px; border-bottom: 1px solid var(--border); }
        .setting-row { margin-bottom: 12px; }
        .setting-row label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
        .setting-input { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.85rem; }
        .btn-save { width: 100%; padding: 10px; background: var(--accent); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }

        /* Dynamic Table Styling */
        .dynamic-card { background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 16px; max-width: 800px; }
        .dynamic-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin-top: 10px; }
        .dynamic-table th { background: var(--accent); color: white; padding: 8px; text-align: left; }
        .dynamic-table td { padding: 8px; border-bottom: 1px solid var(--border); }
        .dynamic-table tr:nth-child(even) { background: #f1f5f9; }
        .sql-debug { font-family: monospace; font-size: 0.75rem; background: #1e293b; color: #a5b4fc; padding: 10px; border-radius: 6px; margin-top: 10px; overflow-x: auto; }
    </style>
</head>
<body>

<div class="chat-wrapper">
    <div class="chat-main">
        <div class="chat-header">
            <div class="icon">✨</div>
            <div>
                <h1>AI Dynamic SQL Assistant</h1>
                <p>Ask anything. I generate queries on the fly.</p>
            </div>
            <button class="settings-toggle-btn" onclick="toggleSettings()">⚙️ Settings</button>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="input-bar">
            <input type="text" id="chatInput" placeholder="Try: 'Show me orders from yesterday' or 'Which customers have the name Vision?'">
            <button id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <!-- Configuration Sidebar -->
    <div class="settings-sidebar collapsed" id="settingsSidebar">
        <div class="settings-header">🔌 System Connections</div>
        <div class="settings-section" id="configForm">
            <div class="setting-row"><label>DB Host</label><input type="text" id="cfg_db_host" class="setting-input"></div>
            <div class="setting-row"><label>DB Port</label><input type="text" id="cfg_db_port" class="setting-input"></div>
            <div class="setting-row"><label>DB Service Name</label><input type="text" id="cfg_db_service" class="setting-input"></div>
            <div class="setting-row"><label>DB User</label><input type="text" id="cfg_db_user" class="setting-input"></div>
            <div class="setting-row"><label>DB Password</label><input type="password" id="cfg_db_password" class="setting-input"></div>
            <div class="setting-row"><label>OpenAI API Key</label><input type="password" id="cfg_openai_key" class="setting-input"></div>
            <button class="btn-save" onclick="saveConfig()">Save Configuration</button>
        </div>
    </div>
</div>

<script>
    const chatMessages = document.getElementById("chatMessages");
    const chatInput = document.getElementById("chatInput");
    
    // Conversation Memory
    let conversationHistory = [];

    window.onload = () => {
        addBot("Hello! I am your AI Schema-Aware Agent. Ask me questions about your data, and I will write the SQL and fetch it for you. Try asking a follow-up question after getting a result!");
        loadConfig();
    };

    chatInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") sendMessage();
    });

    function sendMessage() {
        const text = chatInput.value.trim();
        if (!text) return;
        
        addUser(text);
        chatInput.value = "";
        
        // Add to history
        conversationHistory.push({ role: "user", content: text });

        document.getElementById("sendBtn").disabled = true;

        fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text, history: conversationHistory })
        })
        .then(r => r.json())
        .then(data => {
            if (data.type === "dynamic_table") {
                addDynamicTableCard(data);
                conversationHistory.push({ role: "assistant", content: `(Returned table with ${data.rows.length} rows based on SQL query)` });
            } else if (data.type === "error") {
                addBotError(data.reply);
                conversationHistory.push({ role: "assistant", content: data.reply });
            } else {
                addBot(data.reply);
                conversationHistory.push({ role: "assistant", content: data.reply });
            }
        })
        .catch(err => addBotError("Network Error: " + err.message))
        .finally(() => {
            document.getElementById("sendBtn").disabled = false;
        });
    }

    function addUser(text) {
        const msg = document.createElement("div"); msg.className = "message user";
        msg.innerHTML = `<div class="avatar">You</div><div class="bubble">${escapeHtml(text)}</div>`;
        chatMessages.appendChild(msg);
        scroll();
    }

    function addBot(text) {
        const msg = document.createElement("div"); msg.className = "message bot";
        msg.innerHTML = `<div class="avatar">🤖</div><div class="bubble">${escapeHtml(text)}</div>`;
        chatMessages.appendChild(msg);
        scroll();
    }

    function addBotError(text) {
        const msg = document.createElement("div"); msg.className = "message bot";
        msg.innerHTML = `<div class="avatar">⚠️</div><div class="bubble error">${escapeHtml(text)}</div>`;
        chatMessages.appendChild(msg);
        scroll();
    }

    function addDynamicTableCard(data) {
        const msg = document.createElement("div"); msg.className = "message bot";
        let html = `<div class="avatar">🤖</div><div class="dynamic-card">`;
        html += `<p style="font-weight:600; margin-bottom: 10px;">${escapeHtml(data.explanation)}</p>`;
        
        // Render Table
        html += `<div style="overflow-x:auto;"><table class="dynamic-table"><thead><tr>`;
        data.columns.forEach(col => html += `<th>${escapeHtml(col)}</th>`);
        html += `</tr></thead><tbody>`;
        data.rows.forEach(row => {
            html += `<tr>`;
            row.forEach(cell => html += `<td>${escapeHtml(cell)}</td>`);
            html += `</tr>`;
        });
        html += `</tbody></table></div>`;
        
        // Debug details (SQL)
        html += `<details style="margin-top:15px; cursor:pointer; color:var(--text-muted); font-size:0.8rem;">`;
        html += `<summary>View Generated SQL</summary>`;
        html += `<div class="sql-debug">${escapeHtml(data.sql)}</div></details>`;
        
        html += `</div>`;
        msg.innerHTML = html;
        chatMessages.appendChild(msg);
        scroll();
    }

    function scroll() { chatMessages.scrollTop = chatMessages.scrollHeight; }
    function escapeHtml(text) { return document.createElement('div').appendChild(document.createTextNode(text)).parentNode.innerHTML; }

    // ── Config Logic ──
    function toggleSettings() {
        document.getElementById('settingsSidebar').classList.toggle('collapsed');
    }

    function loadConfig() {
        fetch("/api/config")
            .then(r => r.json())
            .then(cfg => {
                document.getElementById('cfg_db_host').value = cfg.db_host || '';
                document.getElementById('cfg_db_port').value = cfg.db_port || '';
                document.getElementById('cfg_db_service').value = cfg.db_service || '';
                document.getElementById('cfg_db_user').value = cfg.db_user || '';
                document.getElementById('cfg_db_password').value = cfg.db_password || '';
                document.getElementById('cfg_openai_key').value = cfg.openai_api_key || '';
            });
    }

    function saveConfig() {
        const cfg = {
            db_host: document.getElementById('cfg_db_host').value,
            db_port: document.getElementById('cfg_db_port').value,
            db_service: document.getElementById('cfg_db_service').value,
            db_user: document.getElementById('cfg_db_user').value,
            db_password: document.getElementById('cfg_db_password').value,
            openai_api_key: document.getElementById('cfg_openai_key').value
        };
        fetch("/api/config", {
            method: "POST",
            body: JSON.stringify(cfg)
        }).then(() => {
            alert("Configuration Saved!");
        });
    }
</script>

</body>
</html>
