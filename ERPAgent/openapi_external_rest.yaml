openapi: 3.0.3
info:
  title: ERP Agent External REST API
  version: 1.3.0
  description: Sales-order query, lookup, and create-order APIs for the ERP assistant. Retrieve this document from the public tunnel at /openapi.yaml.
servers:
  - url: https://YOUR_PUBLIC_HOST
paths:
  /api/orders/{order_number}:
    get:
      summary: Get a sales order by order number
      operationId: getOrderByNumber
      parameters:
        - name: order_number
          in: path
          required: true
          description: Oracle sales-order number.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Sales-order header and lines.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
  /api/customer-orders:
    get:
      summary: Get a customer's previously ordered sales-order data
      operationId: getCustomerOrderHistory
      parameters:
        - name: customer_name
          in: query
          required: true
          description: Customer name, for example Vision Operations.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Previous sales orders for the specified customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '400':
          description: customer_name was not supplied.
  /api/lookup-items:
    get:
      summary: Find available inventory items by item code
      operationId: findAvailableItems
      parameters:
        - $ref: '#/components/parameters/ItemSearch'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Matching active inventory items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemLookupResponse'
  /api/lookup-customers:
    get:
      summary: Find active customers or customers that previously ordered an item
      operationId: findCustomers
      parameters:
        - name: search
          in: query
          description: Full or partial customer name.
          schema:
            type: string
        - name: item_id
          in: query
          description: Inventory item ID. Returns active customers with prior orders for this item.
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Matching customers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerLookupResponse'
  /api/lookup-customer-sites:
    get:
      summary: List active ship-to sites for a customer
      operationId: getCustomerShipToSites
      parameters:
        - name: cust_account_id
          in: query
          required: true
          description: Customer account ID returned by findCustomers.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Active ship-to sites for the customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerSiteLookupResponse'
  /api/lookup-prices:
    get:
      summary: List available USD price lists for an inventory item
      operationId: getItemPrices
      parameters:
        - name: item_id
          in: query
          required: true
          description: Inventory item ID returned by findAvailableItems.
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Available price lists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceLookupResponse'
  /api/lookup-payment-terms:
    get:
      summary: List active payment terms
      operationId: getPaymentTerms
      parameters:
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Active payment terms.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentTermLookupResponse'
  /api/lookup-salesreps:
    get:
      summary: List active sales representatives for the operating unit
      operationId: getSalesRepresentatives
      parameters:
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Active sales representatives.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesRepLookupResponse'
  /api/orders-advanced:
    get:
      summary: Report previously ordered customer data with optional period and status filters
      operationId: getPreviouslyOrderedCustomerData
      parameters:
        - name: range_type
          in: query
          description: Reporting period filter.
          schema:
            type: string
            enum: [this_week, this_month, last_30_days]
        - name: year
          in: query
          description: Calendar year filter.
          schema:
            type: integer
            minimum: 2000
        - name: status
          in: query
          description: Oracle order status filter, for example BOOKED.
          schema:
            type: string
      responses:
        '200':
          description: Previously ordered sales-order data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
  /api/chat:
    post:
      summary: Chat with ERP agent
      operationId: chatAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  example: Get order 67965
                history:
                  type: array
                  description: Optional previous conversation messages.
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role:
                        type: string
                        enum: [user, assistant]
                      content:
                        type: string
                _visualization_requested:
                  type: boolean
                  default: false
                  description: Request a chart when the returned data supports visualization.
      responses:
        '200':
          description: Chat or ERP operation response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  type:
                    type: string
                    example: order
                  reply:
                    description: Assistant text or operation result.
                  ui_state:
                    type: object
                    additionalProperties: true
        '400':
          description: Validation error
components:
  parameters:
    ItemSearch:
      name: search
      in: query
      required: true
      description: Item code prefix, for example AS54888.
      schema:
        type: string
        minLength: 1
    Offset:
      name: offset
      in: query
      description: Zero-based result offset for pagination.
      schema:
        type: integer
        minimum: 0
        default: 0
  schemas:
    ItemLookupResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              inventory_item_id:
                type: integer
                format: int64
              segment1:
                type: string
              description:
                type: string
        has_more:
          type: boolean
    CustomerLookupResponse:
      type: object
      properties:
        customers:
          type: array
          items:
            type: object
            properties:
              cust_account_id:
                type: integer
                format: int64
              customer_name:
                type: string
              account_number:
                type: string
        has_more:
          type: boolean
    CustomerSiteLookupResponse:
      type: object
      properties:
        sites:
          type: array
          items:
            type: object
            properties:
              ship_to_org_id:
                type: integer
                format: int64
              sold_to_org_id:
                type: integer
                format: int64
              location:
                type: string
              address:
                type: string
              customer_name:
                type: string
    PriceLookupResponse:
      type: object
      properties:
        prices:
          type: array
          items:
            type: object
            properties:
              price_list_id:
                type: integer
                format: int64
              price_list_name:
                type: string
              unit_list_price:
                type: number
        has_more:
          type: boolean
    PaymentTermLookupResponse:
      type: object
      properties:
        terms:
          type: array
          items:
            type: object
            properties:
              term_id:
                type: integer
                format: int64
              term_name:
                type: string
        has_more:
          type: boolean
    SalesRepLookupResponse:
      type: object
      properties:
        reps:
          type: array
          items:
            type: object
            properties:
              salesrep_id:
                type: integer
                format: int64
              salesrep_name:
                type: string
        has_more:
          type: boolean
    OperationResponse:
      type: object
      additionalProperties: true
      properties:
        type:
          type: string
        reply:
          description: ERP operation result.
    AgentMessage:
      type: object
      properties:
        role:
          type: string
          example: assistant
        content:
          type: string
        speak:
          type: string
    AgentSnapshot:
      type: object
      additionalProperties: true
      properties:
        stage:
          type: string
          example: chat
        action:
          type: string
          nullable: true
        messages:
          type: array
          items:
            $ref: '#/components/schemas/AgentMessage'
